site_name: Cuaderno de Aula
site_description: A teacher's digital classroom notebook, generated view by view with the PYTO agent-pipeline framework
repo_url: https://github.com/dbetancorfp/PYTO_CUADERNO_DE_AULA_V0
repo_name: dbetancorfp/PYTO_CUADERNO_DE_AULA_V0

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - toc.follow

nav:
  - Home: index.md
  - Pipeline: pipeline.md
  - Architecture: architecture.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

strict: true
